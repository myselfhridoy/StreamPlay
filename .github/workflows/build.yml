name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle Wrapper
      run: gradle wrapper --gradle-version 8.7

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Universal APK
      uses: actions/upload-artifact@v4
      with:
        name: streambd-player-universal
        path: app/build/outputs/apk/debug/app-universal-debug.apk

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v4
      with:
        name: streambd-player-arm64-v8a
        path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v4
      with:
        name: streambd-player-armeabi-v7a
        path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk

    - name: Upload x86_64 APK
      uses: actions/upload-artifact@v4
      with:
        name: streambd-player-x86_64
        path: app/build/outputs/apk/debug/app-x86_64-debug.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v4
      with:
        name: streambd-player-x86
        path: app/build/outputs/apk/debug/app-x86-debug.apk
